# Descrições usadas na avaliação.
#
# As categorias existem para separar o que o relatório mede: uma casa simples
# que não converge é um problema diferente de uma descrição contraditória que
# não converge.
#
#   simples        poucos cômodos, pedido direto
#   media          casa completa, pedido comum
#   grande         muitos cômodos, onde a geometria fica difícil
#   ambigua        falta informação, o modelo precisa decidir
#   contraditoria  o pedido não fecha, e o interessante é ver como ele sai
#
# O texto vai entre aspas: descrição em português leva dois-pontos, e isso
# quebra o YAML sem aspas.

descriptions:
