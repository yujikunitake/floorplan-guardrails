[project]
name = "floorplan-guardrails"
version = "0.0.0"
description = "An LLM proposes a floor plan; a deterministic validator checks it against design rules."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
# As dependências de runtime entram junto com o código que as usa
# (matplotlib na Fase 2, o agente na Fase 3).
dependencies = [
    "agent-framework==1.19.0",
    "matplotlib>=3.9",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    # O kernel que o notebook da oficina usa. Sem ele o VS Code abre o
    # notebook e não tem em que rodá-lo, o que obrigaria o aluno a escolher
    # kernel na mão — justamente o que o plano proíbe.
    "ipykernel>=6.29",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floorplan_guardrails"]

[tool.ruff]
target-version = "py312"
# O CLAUDE.md exige lint e formatação também nos notebooks da oficina.
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
# O prompt é prosa: quebrar as frases em 88 colunas pioraria o texto que o
# autor edita e que o modelo lê.
"src/floorplan_guardrails/prompt.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
