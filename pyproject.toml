[project]
name = "floorplan-guardrails"
version = "0.0.0"
description = "An LLM proposes a floor plan; a deterministic validator checks it against design rules."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
# As dependências de runtime entram junto com o código que as usa
# (matplotlib na Fase 2, o agente na Fase 3).
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floorplan_guardrails"]

[tool.ruff]
target-version = "py312"
# O CLAUDE.md exige lint e formatação também nos notebooks da oficina.
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.pytest.ini_options]
testpaths = ["tests"]
